[workspace]
resolver = "2"
members = [
    "crates/arcadia-contracts",
    "crates/arcadia-store",
    "crates/arcadia-download",
    "crates/arcadia-api",
    "crates/arcadia-retro",
    "crates/arcadia-sync",
    "crates/arcadia-social",
    "crates/arcadia-launch",
    "crates/arcadia-ipc",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
