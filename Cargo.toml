[workspace]
resolver = "2"
members = [
    "crates/arcadia-contracts",
    "crates/arcadia-store",
    "crates/arcadia-download",
    "crates/arcadia-api",
    "crates/arcadia-retro",
    "crates/arcadia-sync",
    "crates/arcadia-social",
    "crates/arcadia-launch",
    "crates/arcadia-steam",
    "crates/arcadia-media",
    "crates/arcadia-native-media",
    "crates/arcadia-catalog",
    "crates/arcadia-plugins",
    "crates/arcadia-achievements",
    "crates/arcadia-emulators",
    "crates/arcadia-steamstore",
    "crates/arcadia-ra",
    "crates/arcadia-fixes",
    "crates/arcadia-updater",
    "crates/arcadia-gamepad",
    "crates/arcadia-ipc",
    "crates/arcadia-native",
    "crates/arcadia-launcher",
    "crates/arcadia-native-input",
    "crates/arcadia-source-helper",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
