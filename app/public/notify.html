<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    width: 360px;
    height: 96px;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  }

  .toast {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    height: 100%;
    padding: 12px 16px;
    background: rgba(28, 28, 34, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
  }
  .toast.saindo { animation: fade-out 300ms ease-in forwards; }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }

  .icon-wrap {
    width: 64px;
    height: 64px;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .icon {
    width: 64px;
    height: 64px;
    object-fit: cover;
    display: none;
    position: absolute;
    top: 0;
    left: 0;
  }

  .icon.loaded { display: block; }

  .icon-fallback {
    font-size: 36px;
    transition: opacity 0.2s;
  }

  .icon.loaded + .icon-fallback { opacity: 0; position: absolute; }

  .texts {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
    flex: 1;
  }
  .heading { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #f5a623; }
  .title { font-size: 15px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc { font-size: 12px; color: rgba(255, 255, 255, 0.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .trophy { font-size: 36px; }
  .trophy-animate { animation: trophy-rise 1.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards; }
  @keyframes trophy-rise {
    0% { opacity: 0; transform: translateY(40px) rotate(-90deg) scale(0.5); }
    60% { opacity: 1; transform: translateY(-5px) rotate(10deg) scale(1.1); }
    80% { transform: translateY(2px) rotate(-5deg) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  }
</style>
</head>
<body>
  <div id="toast" class="toast">
    <div class="icon-wrap">
      <span id="fallback" class="icon-fallback">🏆</span>
      <img id="icon" class="icon" src="" alt="" />
    </div>
    <div class="texts">
      <div id="heading" class="heading"></div>
      <div id="title" class="title"></div>
      <div id="desc" class="desc"></div>
    </div>
  </div>
  <audio id="som" src="sounds/unlock.wav" autoplay></audio>
  <audio id="som-platinum" src="sounds/platinum.wav"></audio>
  <script>
    const q = new URLSearchParams(location.search)
    const isPlatinum = q.get("sound") === "platinum"
    document.getElementById("heading").textContent = q.get("heading") || "Conquista desbloqueada!"
    document.getElementById("title").textContent = q.get("title") || ""
    document.getElementById("desc").textContent = q.get("desc") || " "
    if (isPlatinum) {
      document.getElementById("fallback").className = "trophy trophy-animate"
      document.getElementById("som").remove()
      const p = document.getElementById("som-platinum"); p.autoplay = true; p.play().catch(()=>{})
      setTimeout(() => window.close(), 8000)
    } else {
      const icon = q.get("icon")
      if (icon) {
        const img = document.getElementById("icon")
        img.onload = () => img.classList.add("loaded")
        img.src = icon
      }
      setTimeout(() => { document.getElementById("toast").classList.add("saindo"); setTimeout(() => window.close(), 300) }, 5000)
    }
  </script>
</body>
</html>
