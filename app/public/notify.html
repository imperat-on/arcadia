<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: transparent; overflow: hidden; }
  body {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif;
  }

  /* ==================== TOAST NORMAL ==================== */
  .toast-normal {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    padding: 20px;
    background: rgba(28, 28, 34, 0.97);
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
    animation: slide-in 300ms ease-out;
  }
  .toast-normal.saindo { animation: fade-out 300ms ease-in forwards; }

  @keyframes slide-in {
    from { opacity: 0; transform: translateX(60px); }
    to { opacity: 1; transform: translateX(0); }
  }
  @keyframes fade-out {
    from { opacity: 1; transform: translateX(0); }
    to { opacity: 0; transform: translateX(30px); }
  }

  .header {
    display: flex;
    align-items: center;
    gap: 16px;
    flex: 1;
  }

  .icon-wrap {
    width: 80px;
    height: 80px;
    flex-shrink: 0;
    border-radius: 12px;
    overflow: hidden;
    background: rgba(255, 255, 255, 0.08);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon {
    width: 80px;
    height: 80px;
    object-fit: cover;
  }

  .icon-fallback {
    font-size: 40px;
  }

  .texts {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
    flex: 1;
  }

  .heading {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #f5a623;
  }

  .title {
    font-size: 18px;
    font-weight: 700;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .desc {
    font-size: 14px;
    color: rgba(255, 255, 255, 0.55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .progress-section {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
  }

  .progress-label {
    font-size: 11px;
    color: rgba(255, 255, 255, 0.4);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .progress-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .game-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #1a1a24;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  .bar-info {
    flex: 1;
  }

  .bar {
    height: 6px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 4px;
  }

  .fill {
    height: 100%;
    background: linear-gradient(90deg, #f5a623, #f4d03f);
    border-radius: 3px;
  }

  .bar-text {
    font-size: 12px;
    color: rgba(255, 255, 255, 0.45);
  }

  .percent {
    font-size: 20px;
    font-weight: 800;
    color: #f5a623;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div id="toast-normal" class="toast-normal">
    <div class="header">
      <div class="icon-wrap">
        <span id="icon-fallback" class="icon-fallback">🏆</span>
        <img id="normal-icon" class="icon" alt="" />
      </div>
      <div class="texts">
        <div id="normal-heading" class="heading"></div>
        <div id="normal-title" class="title"></div>
        <div id="normal-desc" class="desc"></div>
      </div>
    </div>
    <div id="normal-progress" class="progress-section" style="display:none;">
      <div class="progress-label">Progresso total de troféus</div>
      <div class="progress-wrap">
        <div id="normal-game-icon" class="game-icon">🏴‍☠️</div>
        <div class="bar-info">
          <div class="bar"><div id="normal-fill" class="fill" style="width: 0%;"></div></div>
          <div id="normal-bar-text" class="bar-text">0/49 conquistas</div>
        </div>
        <div id="normal-percent" class="percent">0%</div>
      </div>
    </div>
  </div>

  <audio id="som" src="sounds/unlock.wav" autoplay></audio>

  <script>
    const q = new URLSearchParams(location.search)

    // Show normal toast
    document.getElementById("normal-heading").textContent = q.get("heading") || "Conquista desbloqueada!"
    document.getElementById("normal-title").textContent = q.get("title") || ""
    document.getElementById("normal-desc").textContent = q.get("desc") || " "

    // Icon
    const icon = q.get("icon")
    if (icon) {
      const img = document.getElementById("normal-icon")
      img.src = icon
      img.onload = () => {
        img.style.display = "block"
        document.getElementById("icon-fallback").style.display = "none"
      }
    }

    // Progress bar
    const done = parseInt(q.get("done") || "0")
    const total = parseInt(q.get("total") || "0")
    if (total > 0) {
      const pct = Math.round((done / total) * 100)
      document.getElementById("normal-progress").style.display = "block"
      document.getElementById("normal-fill").style.width = pct + "%"
      document.getElementById("normal-bar-text").textContent = done + "/" + total + " conquistas"
      document.getElementById("normal-percent").textContent = pct + "%"
    }

    // Close after 5 seconds
    setTimeout(() => {
      document.getElementById("toast-normal").classList.add("saindo")
      setTimeout(() => window.close(), 300)
    }, 5000)
  </script>
</body>
</html>
