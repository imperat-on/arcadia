name: Arcadia CI

on:
  push:
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: app
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win nsis --x64
          - os: ubuntu-latest
            target: linux AppImage --x64
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Validate tag version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "const fs=require('fs'); const tag=process.env.RELEASE_TAG.replace(/^v/, ''); const version=JSON.parse(fs.readFileSync('package.json')).version; if(tag!==version) throw new Error('Tag '+tag+' does not match package version '+version)"
      - name: Build package and update metadata
        run: |
          npm run build
          npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            app/release/Arcadia-Setup-*.exe
            app/release/Arcadia-*.AppImage
            app/release/*.blockmap
            app/release/latest*.yml

  draft:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release
      - name: Verify assets and create draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=${RELEASE_TAG#v}
          test -s "release/Arcadia-Setup-$version-x64.exe"
          test -s "release/Arcadia-Setup-$version-x64.exe.blockmap"
          test -s "release/Arcadia-$version-x86_64.AppImage"
          grep -Fx "version: $version" release/latest.yml
          grep -Fx "version: $version" release/latest-linux.yml
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --generate-notes release/*
