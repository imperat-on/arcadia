[package]
name = "arcadia-ipc"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
arcadia-contracts = { path = "../arcadia-contracts" }
arcadia-store = { path = "../arcadia-store" }
arcadia-api = { path = "../arcadia-api" }
arcadia-sync = { path = "../arcadia-sync" }
arcadia-social = { path = "../arcadia-social" }
arcadia-launch = { path = "../arcadia-launch" }
arcadia-steam = { path = "../arcadia-steam" }
arcadia-media = { path = "../arcadia-media" }
arcadia-plugins = { path = "../arcadia-plugins" }
arcadia-catalog = { path = "../arcadia-catalog" }
arcadia-achievements = { path = "../arcadia-achievements" }
arcadia-emulators = { path = "../arcadia-emulators" }
arcadia-retro = { path = "../arcadia-retro" }
arcadia-steamstore = { path = "../arcadia-steamstore" }
arcadia-fixes = { path = "../arcadia-fixes" }
arcadia-download = { path = "../arcadia-download" }
arcadia-ra = { path = "../arcadia-ra" }
arcadia-updater = { path = "../arcadia-updater" }
sha2 = "0.10"
fs2 = "0.4"
base64 = "0.23"
async-trait = "0.1"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["sync", "rt", "process", "macros", "time", "io-util"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
percent-encoding = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
tokio = { version = "1", features = ["sync", "macros", "rt"] }
