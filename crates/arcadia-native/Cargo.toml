[package]
name = "arcadia-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frontend nativo do Arcadia em Rust puro (iced), sem Tauri e sem webview"

[dependencies]
arcadia-api = { path = "../arcadia-api" }
arcadia-ipc = { path = "../arcadia-ipc" }
arcadia-native-input = { path = "../arcadia-native-input" }
arcadia-native-media = { path = "../arcadia-native-media" }
arcadia-store = { path = "../arcadia-store" }
# Relógio da top bar do Big Picture.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `tokio` habilita `iced::time::every`, usado pela Subscription que drena os
# frames do player a ~60 fps (o backend default do iced não tem timer).
iced = { version = "0.14", features = ["image", "advanced", "tokio"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "macros",
] }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
] }
# `avatar:load` devolve data URL; o Handle do iced recebe os bytes decodificados.
base64 = "0.23"
# Seletor nativo via zenity/kdialog (sem GTK/rfd). Ver `src/picker.rs`.
