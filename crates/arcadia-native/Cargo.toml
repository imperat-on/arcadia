[package]
name = "arcadia-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Frontend nativo do Arcadia em Rust puro (iced), sem Tauri e sem webview na interface"

[build-dependencies]
embed-resource = "3"

[dependencies]
arcadia-api = { path = "../arcadia-api" }
arcadia-catalog = { path = "../arcadia-catalog" }
arcadia-ipc = { path = "../arcadia-ipc" }
arcadia-native-input = { path = "../arcadia-native-input" }
arcadia-native-media = { path = "../arcadia-native-media" }
arcadia-store = { path = "../arcadia-store" }
# Relógio da top bar do Big Picture.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# `tokio` habilita `iced::time::every`, usado pela Subscription que drena os
# frames do player a ~60 fps (o backend default do iced não tem timer).
iced = { version = "0.14", features = ["image", "advanced", "tokio", "canvas"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "sync",
    "time",
    "net",
    "macros",
] }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
# `avif-native` é obrigatório: a Steam serve boa parte das artes de loja e das
# figuras do `about` como `.avif`. A feature `avif` do crate `image` traz só o
# ENCODER (`ravif`); quem decodifica é `avif-native`, que puxa o `dav1d`.
# Sem ela, `load_from_memory` devolve "format Avif is not supported" e a
# imagem vira card vazio — sem nenhum aviso na UI.
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
    "gif",
    "avif-native",
] }
# `avatar:load` devolve data URL; o Handle do iced recebe os bytes decodificados.
base64 = "0.23"
sha2 = "0.10"
async-trait = "0.1"
# Seletor nativo via zenity/kdialog (sem GTK/rfd). Ver `src/picker.rs`.
