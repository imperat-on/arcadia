services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: arcadia
      POSTGRES_PASSWORD: arcadia
      POSTGRES_DB: arcadia_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arcadia -d arcadia_test"]
      interval: 2s
      timeout: 3s
      retries: 20
