[package]
name = "arcadia"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Produção: embarca os assets da UI e ignora o devUrl. É a feature que o
# `tauri build` liga automaticamente.
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
arcadia-api = { path = "../crates/arcadia-api" }
arcadia-contracts = { path = "../crates/arcadia-contracts" }
arcadia-ipc = { path = "../crates/arcadia-ipc" }
arcadia-store = { path = "../crates/arcadia-store" }
tokio = { version = "1", features = ["sync"] }
